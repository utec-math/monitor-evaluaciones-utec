<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Monitor de Evaluaciones · Estudiante v0.9</title>
<style>
:root{
  --ivory:#F0E7D8;
  --surface:#FAF7F1;
  --camel:#B99A75;
  --camel-soft:#D8C6AE;
  --tobacco:#765642;
  --petroleum:#35585A;
  --charcoal:#2E2E2E;
  --muted:#786F66;
  --success:#3F6B52;
  --success-bg:#DDE9DF;
  --warning:#8A6513;
  --warning-bg:#F6EACB;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow-x:hidden;
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  background:var(--ivory);
  color:var(--charcoal);
}
body::before,body::after{
  content:"";
  position:fixed;
  z-index:0;
  pointer-events:none;
  border:28px solid rgba(185,154,117,.09);
  border-radius:50%;
}
body::before{width:650px;height:650px;left:-470px;bottom:-420px}
body::after{width:660px;height:660px;right:-430px;top:-160px}
.shell{
  position:relative;
  z-index:2;
  width:min(650px,calc(100% - 34px));
  margin:38px auto 64px;
}
.head{
  background:var(--petroleum);
  color:#fff;
  padding:22px 24px 20px;
  border:1px solid rgba(118,86,66,.32);
  border-bottom:0;
  border-radius:16px 16px 0 0;
}
.kicker{
  font-size:12px;
  color:#E6D5BD;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.title{
  font-size:26px;
  font-weight:750;
  margin-top:5px;
  letter-spacing:.01em;
}
.card{
  background:var(--surface);
  border:1px solid var(--camel-soft);
  border-top:0;
  padding:30px 25px 28px;
  border-radius:0 0 16px 16px;
  box-shadow:0 16px 34px rgba(86,63,45,.10);
  text-align:center;
}
.status-mark{
  width:84px;
  height:84px;
  margin:0 auto 16px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--success-bg);
  color:var(--success);
  font-size:42px;
  font-weight:800;
  border:1px solid rgba(63,107,82,.08);
}
.status-title{
  margin:0;
  color:var(--success);
  font-size:30px;
  letter-spacing:.05em;
  font-weight:750;
}
.status-detail{
  margin:7px 0 23px;
  color:var(--muted);
  font-size:15px;
}
.identity{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
  text-align:left;
  margin:0 auto 18px;
}
.identity-item{
  padding:13px 14px;
  border:1px solid var(--camel-soft);
  border-radius:10px;
  background:#FFFDF9;
  min-width:0;
}
.identity-item.wide{grid-column:1/-1}
.identity-label{
  font-size:11px;
  color:var(--tobacco);
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.identity-value{
  margin-top:4px;
  color:var(--charcoal);
  font-size:16px;
  font-weight:700;
  overflow-wrap:anywhere;
}
.instruction{
  padding:13px 15px;
  border-radius:10px;
  background:#EFE5D6;
  color:#5F574F;
  font-size:14px;
  line-height:1.45;
  border:1px solid rgba(185,154,117,.16);
}
.blocked .status-mark{background:var(--warning-bg);color:var(--warning);font-size:34px}
.blocked .status-title{color:var(--warning)}
.hidden{display:none!important}
.decor-pixels{
  position:fixed;
  z-index:1;
  width:16px;
  height:16px;
  background:rgba(185,154,117,.5);
  pointer-events:none;
}
.decor-pixels.top{left:62px;top:72px;box-shadow:-18px 18px 0 rgba(185,154,117,.5),18px 36px 0 rgba(185,154,117,.5)}
.decor-pixels.bottom{right:70px;bottom:92px;box-shadow:-18px 18px 0 rgba(185,154,117,.5),-36px 36px 0 rgba(185,154,117,.5)}
.footer{
  position:fixed;
  z-index:1;
  left:36px;
  right:30px;
  bottom:16px;
  display:flex;
  align-items:center;
  gap:18px;
  color:rgba(185,154,117,.95);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  pointer-events:none;
}
.footer-line{height:1px;flex:1;background:rgba(185,154,117,.55)}
.footer-version{letter-spacing:.04em;text-transform:none}
@media(max-width:600px){
  body{place-items:start center}
  .shell{width:min(100% - 20px,650px);margin:12px auto 52px}
  .head{padding:18px 19px}
  .title{font-size:23px}
  .card{padding:23px 19px}
  .identity{grid-template-columns:1fr}
  .identity-item.wide{grid-column:auto}
  .status-title{font-size:26px}
  .decor-pixels{display:none}
  .footer{left:18px;right:18px;font-size:8px;gap:10px;letter-spacing:.14em}
}
</style>
</head>
<body>
<div class="decor-pixels top" aria-hidden="true"></div>
<div class="decor-pixels bottom" aria-hidden="true"></div>
<main class="shell">
  <header class="head"><div class="kicker">MONITOR · EVALUACIÓN</div><div class="title">Monitor de Evaluaciones</div></header>
  <section id="card" class="card">
    <div class="status-mark" id="mark">✓</div>
    <h1 class="status-title" id="title">CONECTADO</h1>
    <p class="status-detail" id="detail">El monitor está funcionando correctamente.</p>
    <div class="identity" id="identity">
      <div class="identity-item wide"><div class="identity-label">Estudiante</div><div id="name" class="identity-value"></div></div>
      <div class="identity-item"><div class="identity-label">Documento</div><div id="sid" class="identity-value"></div></div>
      <div class="identity-item"><div class="identity-label">Sesión</div><div id="session" class="identity-value"></div></div>
    </div>
    <div class="instruction" id="instruction">Mantené abierta la aplicación durante toda la evaluación. La cámara permanece exclusivamente en Google Meet.</div>
  </section>
</main>
<footer class="footer" aria-hidden="true">
  <span>Educación · Evaluación · Oportunidades</span>
  <span class="footer-line"></span>
  <span class="footer-version">v0.9</span>
</footer>
<script>
const params=new URLSearchParams(location.search),name=(params.get('name')||'').trim(),sid=(params.get('sid')||'').trim(),session=(params.get('session')||'').trim(),fromApp=params.get('autostart')==='1';
if(fromApp&&name&&sid&&session){document.getElementById('name').textContent=name;document.getElementById('sid').textContent=sid;document.getElementById('session').textContent=session}
else{const card=document.getElementById('card');card.classList.add('blocked');document.getElementById('mark').textContent='!';document.getElementById('title').textContent='ABRIR LA APLICACIÓN';document.getElementById('detail').textContent='El monitoreo solo se inicia desde la aplicación instalada.';document.getElementById('identity').classList.add('hidden');document.getElementById('instruction').textContent=session?`Ingresá desde Monitor de Evaluaciones con el código de sesión: ${session}`:'Ingresá desde Monitor de Evaluaciones y completá los datos de la sesión.'}
</script>
</body>
</html>
