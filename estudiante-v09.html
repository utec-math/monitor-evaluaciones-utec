<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Monitor UTEC · Estudiante v0.9</title>
<style>
:root{--deep:#123f4f;--teal:#15949b;--ink:#18333d;--line:#d7e3e7;--muted:#6f838b;--ok:#177245;--ok-bg:#e7f6ed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;background:#edf3f5;color:var(--ink)}
.shell{width:min(620px,calc(100% - 28px));margin:24px auto}.head{background:var(--deep);color:#fff;padding:20px 22px;border-radius:14px 14px 0 0}.kicker{font-size:12px;color:#9fd8d7;font-weight:700;letter-spacing:1.2px}.title{font-size:25px;font-weight:800;margin-top:4px}.card{background:#fff;border:1px solid #cfdee3;border-top:0;padding:28px 24px;border-radius:0 0 14px 14px;box-shadow:0 10px 28px rgba(18,63,79,.08);text-align:center}.status-mark{width:82px;height:82px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok);font-size:42px;font-weight:800}.status-title{margin:0;color:var(--ok);font-size:30px;letter-spacing:.04em}.status-detail{margin:7px 0 22px;color:var(--muted);font-size:15px}.identity{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:0 auto 18px}.identity-item{padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:#fbfdfe;min-width:0}.identity-item.wide{grid-column:1/-1}.identity-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}.identity-value{margin-top:4px;font-size:16px;font-weight:700;overflow-wrap:anywhere}.instruction{padding:12px 14px;border-radius:9px;background:#f3f7f8;color:#536970;font-size:14px;line-height:1.45}.blocked .status-mark{background:#fff5d8;color:#8a6513;font-size:34px}.blocked .status-title{color:#8a6513}.hidden{display:none!important}@media(max-width:520px){.shell{width:min(100% - 20px,620px);margin:10px auto}.head{padding:17px 18px}.card{padding:22px 19px}.identity{grid-template-columns:1fr}.identity-item.wide{grid-column:auto}.status-title{font-size:26px}}
</style>
</head>
<body>
<main class="shell">
  <header class="head"><div class="kicker">UTEC · EVALUACIÓN</div><div class="title">Monitor de evaluación</div></header>
  <section id="card" class="card">
    <div class="status-mark" id="mark">✓</div>
    <h1 class="status-title" id="title">CONECTADO</h1>
    <p class="status-detail" id="detail">El monitor está funcionando correctamente.</p>
    <div class="identity" id="identity">
      <div class="identity-item wide"><div class="identity-label">Estudiante</div><div id="name" class="identity-value"></div></div>
      <div class="identity-item"><div class="identity-label">Documento</div><div id="sid" class="identity-value"></div></div>
      <div class="identity-item"><div class="identity-label">Sesión</div><div id="session" class="identity-value"></div></div>
    </div>
    <div class="instruction" id="instruction">Mantené abierta la aplicación durante toda la evaluación. La cámara permanece exclusivamente en Google Meet.</div>
  </section>
</main>
<script>
const params=new URLSearchParams(location.search),name=(params.get('name')||'').trim(),sid=(params.get('sid')||'').trim(),session=(params.get('session')||'').trim(),fromApp=params.get('autostart')==='1';
if(fromApp&&name&&sid&&session){document.getElementById('name').textContent=name;document.getElementById('sid').textContent=sid;document.getElementById('session').textContent=session}
else{const card=document.getElementById('card');card.classList.add('blocked');document.getElementById('mark').textContent='!';document.getElementById('title').textContent='ABRIR LA APLICACIÓN';document.getElementById('detail').textContent='El monitoreo solo se inicia desde la aplicación instalada.';document.getElementById('identity').classList.add('hidden');document.getElementById('instruction').textContent=session?`Ingresá desde Monitor de Evaluaciones UTEC con el código de sesión: ${session}`:'Ingresá desde Monitor de Evaluaciones UTEC y completá los datos de la sesión.'}
</script>
</body>
</html>
