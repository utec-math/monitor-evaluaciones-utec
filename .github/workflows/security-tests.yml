name: Pruebas de seguridad

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "database.rules.json"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
