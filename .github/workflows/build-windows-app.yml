name: Build Windows exam app

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-app/**'
      - '.github/workflows/build-windows-app.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\windows-app\MonitorEvaluaciones.App\MonitorEvaluaciones.App.csproj

      - name: Publish win-x64
        run: dotnet publish .\windows-app\MonitorEvaluaciones.App\MonitorEvaluaciones.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\MonitorEvaluacionesUTEC

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorEvaluacionesUTEC-win-x64
          path: .\artifacts\MonitorEvaluacionesUTEC\
          if-no-files-found: error
